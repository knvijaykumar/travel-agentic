[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-travel-agent"
version = "0.1.0"
description = "AI-Powered Virtual Travel Agent for high-speed itinerary creation and constraint-driven scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "backend"]
